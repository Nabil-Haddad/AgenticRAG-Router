<svg viewBox="0 0 1420 900" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Agentic MCP layer architecture</title>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M1,1 L8,5 L1,9 Z" fill="#7d8ba1"/>
</marker>
<symbol id="fileIcon" viewBox="0 0 100 130">
<path d="M0,0 L78,0 L100,22 L100,130 L0,130 Z" stroke-width="3" stroke-linejoin="round"/>
<path d="M78,0 L78,22 L100,22 Z" fill="#ffffff" fill-opacity="0.12" stroke-width="2" stroke-linejoin="round"/>
</symbol>
<symbol id="cacheIcon" viewBox="0 0 46 46">
<rect x="10" y="10" width="28" height="28" rx="5" fill="#0b1220" stroke-width="2"/>
<rect x="6" y="6" width="28" height="28" rx="5" stroke-width="2"/>
</symbol>
<symbol id="agentIcon" viewBox="0 0 120 120">
<rect x="10" y="10" width="100" height="100" rx="14" stroke-width="3"/>
<line x1="60" y1="63" x2="60" y2="35" stroke="#ffffff" stroke-opacity="0.85" stroke-width="3"/>
<line x1="60" y1="63" x2="35" y2="65" stroke="#ffffff" stroke-opacity="0.85" stroke-width="3"/>
<line x1="60" y1="63" x2="85" y2="65" stroke="#ffffff" stroke-opacity="0.85" stroke-width="3"/>
<line x1="60" y1="63" x2="60" y2="90" stroke="#ffffff" stroke-opacity="0.85" stroke-width="3"/>
<circle cx="60" cy="35" r="5.5" fill="#ffffff" fill-opacity="0.9"/>
<circle cx="35" cy="65" r="5.5" fill="#ffffff" fill-opacity="0.9"/>
<circle cx="85" cy="65" r="5.5" fill="#ffffff" fill-opacity="0.9"/>
<circle cx="60" cy="90" r="5.5" fill="#ffffff" fill-opacity="0.9"/>
<circle cx="60" cy="63" r="8" fill="#ffffff" fill-opacity="0.95"/>
</symbol>
<symbol id="serverIcon" viewBox="0 0 120 120">
<rect x="10" y="10" width="100" height="100" rx="8" stroke-width="3"/>
<line x1="10" y1="43" x2="110" y2="43" stroke-width="2"/>
<line x1="10" y1="76" x2="110" y2="76" stroke-width="2"/>
<circle cx="25" cy="26" r="4" fill="#4ade80" stroke="none"/>
<circle cx="25" cy="59" r="4" fill="#4ade80" stroke="none"/>
<circle cx="25" cy="92" r="4" fill="#4ade80" stroke="none"/>
</symbol>
</defs>

<rect x="0" y="0" width="1420" height="900" fill="#0b1220"/>

<g font-size="12" fill="#94a3b8">
<rect x="1130" y="15" width="24" height="18" rx="4" fill="#16223a" stroke="#60a5fa" stroke-width="2"/>
<text x="1162" y="31">code module</text>
<use href="#cacheIcon" x="1280" y="12" width="24" height="24" fill="#334155" stroke="#cbd5e1"/>
<text x="1312" y="31">memory cache</text>
</g>

<rect x="60" y="410" width="190" height="90" rx="10" fill="#16223a" stroke="#60a5fa" stroke-width="2.5"/>
<text x="155" y="448" text-anchor="middle" fill="#e2e8f0" font-size="14" font-weight="700">main.py --agent</text>
<text x="155" y="468" text-anchor="middle" fill="#94a3b8" font-size="11">entry point</text>

<use href="#agentIcon" x="330" y="365" width="150" height="150" fill="#2a2210" stroke="#fbbf24"/>
<text x="405" y="348" text-anchor="middle" fill="#cbd5e1" font-size="13">Agent (Claude, Anthropic API)</text>

<use href="#serverIcon" x="660" y="365" width="150" height="150" fill="#12283a" stroke="#38bdf8"/>
<text x="735" y="348" text-anchor="middle" fill="#cbd5e1" font-size="13">MCP Server (subprocess)</text>
<text x="735" y="537" text-anchor="middle" fill="#64748b" font-size="11">3 named tools</text>
<use href="#cacheIcon" x="798" y="352" width="26" height="26" fill="#334155" stroke="#cbd5e1"/>

<rect x="970" y="410" width="230" height="90" rx="10" fill="#16223a" stroke="#60a5fa" stroke-width="2.5"/>
<text x="1085" y="448" text-anchor="middle" fill="#e2e8f0" font-size="14" font-weight="700">Retrieval methods</text>
<text x="1085" y="468" text-anchor="middle" fill="#94a3b8" font-size="11">bm25, vector, hybrid (Part 1)</text>

<line x1="250" y1="432" x2="328" y2="432" stroke="#7d8ba1" stroke-width="2" marker-end="url(#ah)"/>
<text x="289" y="422" text-anchor="middle" fill="#64748b" font-size="10">query</text>
<line x1="328" y1="472" x2="250" y2="472" stroke="#7d8ba1" stroke-width="2" marker-end="url(#ah)"/>
<text x="289" y="492" text-anchor="middle" fill="#64748b" font-size="10">final answer</text>

<line x1="482" y1="432" x2="658" y2="432" stroke="#7d8ba1" stroke-width="2" marker-end="url(#ah)"/>
<text x="570" y="422" text-anchor="middle" fill="#64748b" font-size="10">tool call, one tool only</text>
<line x1="658" y1="472" x2="482" y2="472" stroke="#7d8ba1" stroke-width="2" marker-end="url(#ah)"/>
<text x="570" y="492" text-anchor="middle" fill="#64748b" font-size="10">tool result</text>

<line x1="812" y1="450" x2="968" y2="450" stroke="#7d8ba1" stroke-width="2" stroke-dasharray="6,5" marker-end="url(#ah)"/>

<path d="M405,515 L405,560" fill="none" stroke="#7d8ba1" stroke-width="2" marker-end="url(#ah)"/>

<rect x="310" y="565" width="230" height="110" rx="10" fill="#241b3a" stroke="#c084fc" stroke-width="2.5"/>
<text x="425" y="595" text-anchor="middle" fill="#e2e8f0" font-size="14" font-weight="700">Agent choice benchmark</text>
<text x="425" y="617" text-anchor="middle" fill="#94a3b8" font-size="11">mcp_choice_arena.py</text>
<text x="425" y="635" text-anchor="middle" fill="#94a3b8" font-size="11">resume aware, saves after every query</text>

<line x1="540" y1="600" x2="618" y2="600" stroke="#7d8ba1" stroke-width="2" stroke-dasharray="6,5" marker-end="url(#ah)"/>
<text x="580" y="590" text-anchor="middle" fill="#64748b" font-size="10">scores against</text>

<use href="#fileIcon" x="620" y="560" width="90" height="117" fill="#1c2740" stroke="#94a3b8"/>
<text x="665" y="548" text-anchor="middle" fill="#cbd5e1" font-size="12">qrels.json, ground truth (Part 2)</text>

<path d="M540,650 C700,650 700,690 828,680" fill="none" stroke="#7d8ba1" stroke-width="2" marker-end="url(#ah)"/>

<use href="#fileIcon" x="830" y="610" width="110" height="143" fill="#1c2740" stroke="#94a3b8"/>
<text x="885" y="598" text-anchor="middle" fill="#cbd5e1" font-size="12">results.json, method_choice.png, choices.csv</text>

<text x="700" y="875" text-anchor="middle" fill="#f8fafc" font-size="15" font-weight="700">Figure 3. Agentic layer: the agent, the MCP server, and the benchmark that closes the loop against ground truth.</text>
</svg>
