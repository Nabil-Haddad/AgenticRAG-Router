<svg viewBox="0 0 1550 910" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Retrieval pipeline architecture</title>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M1,1 L8,5 L1,9 Z" fill="#7d8ba1"/>
</marker>
<symbol id="fileIcon" viewBox="0 0 100 130">
<path d="M0,0 L78,0 L100,22 L100,130 L0,130 Z" stroke-width="3" stroke-linejoin="round"/>
<path d="M78,0 L78,22 L100,22 Z" fill="#ffffff" fill-opacity="0.12" stroke-width="2" stroke-linejoin="round"/>
</symbol>
<symbol id="cylinderIcon" viewBox="0 0 100 90">
<path d="M0,15 A50,15 0 0 0 100,15 L100,75 A50,15 0 0 1 0,75 Z" stroke-width="3"/>
<ellipse cx="50" cy="15" rx="50" ry="15" stroke-width="3"/>
<ellipse cx="50" cy="15" rx="50" ry="15" fill="#ffffff" fill-opacity="0.06" stroke="none"/>
</symbol>
<symbol id="cacheIcon" viewBox="0 0 46 46">
<rect x="10" y="10" width="28" height="28" rx="5" fill="#0b1220" stroke-width="2"/>
<rect x="6" y="6" width="28" height="28" rx="5" stroke-width="2"/>
</symbol>
</defs>

<rect x="0" y="0" width="1550" height="910" fill="#0b1220"/>

<g font-size="12" fill="#94a3b8">
<rect x="1250" y="15" width="24" height="18" rx="4" fill="#16223a" stroke="#60a5fa" stroke-width="2"/>
<text x="1282" y="31">code module</text>
<use href="#cacheIcon" x="1420" y="12" width="24" height="24" fill="#334155" stroke="#cbd5e1"/>
<text x="1452" y="31">memory cache</text>
</g>

<use href="#fileIcon" x="340" y="54" width="80" height="104" fill="#1c2740" stroke="#94a3b8"/>
<text x="380" y="42" text-anchor="middle" fill="#cbd5e1" font-size="12">manifest.json</text>
<text x="380" y="172" text-anchor="middle" fill="#64748b" font-size="10.5">tracks a hash per file</text>
<line x1="330" y1="190" x2="330" y2="158" stroke="#7d8ba1" stroke-width="2" marker-end="url(#ah)"/>
<text x="300" y="177" text-anchor="end" fill="#64748b" font-size="10.5">writes hash</text>
<line x1="400" y1="158" x2="400" y2="190" stroke="#7d8ba1" stroke-width="2" marker-end="url(#ah)"/>
<text x="430" y="177" text-anchor="start" fill="#64748b" font-size="10.5">reads hash</text>

<g stroke="#94a3b8" fill="#1c2740">
<use href="#fileIcon" x="72" y="157" width="110" height="143" opacity="0.5"/>
<use href="#fileIcon" x="60" y="169" width="110" height="143"/>
</g>
<text x="115" y="150" text-anchor="middle" fill="#cbd5e1" font-size="13">Data/raw/*.pdf</text>

<rect x="260" y="190" width="210" height="100" rx="10" fill="#16223a" stroke="#60a5fa" stroke-width="2.5"/>
<text x="365" y="230" text-anchor="middle" fill="#e2e8f0" font-size="15" font-weight="700">Ingestion</text>
<text x="365" y="252" text-anchor="middle" fill="#94a3b8" font-size="11.5">process.py</text>
<text x="365" y="270" text-anchor="middle" fill="#94a3b8" font-size="11.5">extracts, cleans, hashes each file</text>

<g stroke="#94a3b8" fill="#1c2740">
<use href="#fileIcon" x="552" y="157" width="110" height="143" opacity="0.5"/>
<use href="#fileIcon" x="540" y="169" width="110" height="143"/>
</g>
<text x="595" y="150" text-anchor="middle" fill="#cbd5e1" font-size="13">Data/processed/*.json</text>

<rect x="720" y="190" width="210" height="100" rx="10" fill="#16223a" stroke="#60a5fa" stroke-width="2.5"/>
<text x="825" y="230" text-anchor="middle" fill="#e2e8f0" font-size="15" font-weight="700">Chunking</text>
<text x="825" y="252" text-anchor="middle" fill="#94a3b8" font-size="11.5">chunk.py</text>
<text x="825" y="270" text-anchor="middle" fill="#94a3b8" font-size="11.5">token aware splits with overlap</text>

<use href="#fileIcon" x="1000" y="169" width="110" height="143" fill="#1c2740" stroke="#94a3b8"/>
<text x="1055" y="150" text-anchor="middle" fill="#cbd5e1" font-size="13">Data/chunks/chunks.json</text>

<line x1="182" y1="240" x2="258" y2="240" stroke="#7d8ba1" stroke-width="2" marker-end="url(#ah)"/>
<line x1="472" y1="225" x2="538" y2="225" stroke="#7d8ba1" stroke-width="2" marker-end="url(#ah)"/>
<line x1="662" y1="255" x2="718" y2="255" stroke="#7d8ba1" stroke-width="2" marker-end="url(#ah)"/>
<line x1="932" y1="225" x2="998" y2="225" stroke="#7d8ba1" stroke-width="2" marker-end="url(#ah)"/>

<path d="M1055,312 L1055,390 L165,390 L165,498" fill="none" stroke="#7d8ba1" stroke-width="2" marker-end="url(#ah)"/>

<path d="M1100,280 C1250,320 1250,360 1120,408" fill="none" stroke="#7d8ba1" stroke-width="2" stroke-dasharray="6,5" marker-end="url(#ah)"/>
<text x="1230" y="360" text-anchor="middle" fill="#64748b" font-size="10.5">read directly, bypasses the vector store</text>

<rect x="60" y="500" width="210" height="100" rx="10" fill="#16223a" stroke="#60a5fa" stroke-width="2.5"/>
<text x="165" y="540" text-anchor="middle" fill="#e2e8f0" font-size="15" font-weight="700">Embedding</text>
<text x="165" y="562" text-anchor="middle" fill="#94a3b8" font-size="11.5">embed.py</text>
<text x="165" y="580" text-anchor="middle" fill="#94a3b8" font-size="11.5">sentence transformers model</text>
<use href="#cacheIcon" x="248" y="486" width="30" height="30" fill="#334155" stroke="#cbd5e1"/>

<line x1="270" y1="550" x2="338" y2="550" stroke="#7d8ba1" stroke-width="2" marker-end="url(#ah)"/>

<rect x="340" y="500" width="210" height="100" rx="10" fill="#16223a" stroke="#60a5fa" stroke-width="2.5"/>
<text x="445" y="540" text-anchor="middle" fill="#e2e8f0" font-size="15" font-weight="700">Indexing</text>
<text x="445" y="562" text-anchor="middle" fill="#94a3b8" font-size="11.5">index.py</text>
<text x="445" y="580" text-anchor="middle" fill="#94a3b8" font-size="11.5">writes into the vector store</text>

<line x1="552" y1="550" x2="618" y2="550" stroke="#7d8ba1" stroke-width="2" marker-end="url(#ah)"/>

<use href="#cylinderIcon" x="620" y="474" width="170" height="153" fill="#123529" stroke="#34d399"/>
<text x="705" y="458" text-anchor="middle" fill="#cbd5e1" font-size="13">ChromaDB collection</text>

<line x1="792" y1="530" x2="868" y2="450" stroke="#7d8ba1" stroke-width="2" marker-end="url(#ah)"/>
<line x1="792" y1="550" x2="868" y2="550" stroke="#7d8ba1" stroke-width="2" marker-end="url(#ah)"/>
<line x1="792" y1="590" x2="868" y2="655" stroke="#7d8ba1" stroke-width="2" marker-end="url(#ah)"/>

<rect x="870" y="385" width="230" height="90" rx="10" fill="#241b3a" stroke="#c084fc" stroke-width="2.5"/>
<text x="985" y="420" text-anchor="middle" fill="#e2e8f0" font-size="14" font-weight="700">BM25 search</text>
<text x="985" y="440" text-anchor="middle" fill="#94a3b8" font-size="11">lexical, keyword matching</text>
<use href="#cacheIcon" x="1072" y="372" width="26" height="26" fill="#334155" stroke="#cbd5e1"/>

<rect x="870" y="505" width="230" height="90" rx="10" fill="#241b3a" stroke="#c084fc" stroke-width="2.5"/>
<text x="985" y="540" text-anchor="middle" fill="#e2e8f0" font-size="14" font-weight="700">Vector search</text>
<text x="985" y="560" text-anchor="middle" fill="#94a3b8" font-size="11">dense, cosine similarity</text>

<rect x="870" y="625" width="230" height="90" rx="10" fill="#241b3a" stroke="#c084fc" stroke-width="2.5"/>
<text x="985" y="660" text-anchor="middle" fill="#e2e8f0" font-size="14" font-weight="700">Hybrid RRF</text>
<text x="985" y="680" text-anchor="middle" fill="#94a3b8" font-size="11">fuses both rankings by rank</text>

<line x1="1123" y1="420" x2="1178" y2="505" stroke="#7d8ba1" stroke-width="2" marker-end="url(#ah)"/>
<line x1="1100" y1="550" x2="1178" y2="550" stroke="#7d8ba1" stroke-width="2" marker-end="url(#ah)"/>
<line x1="1123" y1="680" x2="1178" y2="590" stroke="#7d8ba1" stroke-width="2" marker-end="url(#ah)"/>

<rect x="1180" y="480" width="230" height="140" rx="10" fill="#16223a" stroke="#60a5fa" stroke-width="2.5"/>
<text x="1295" y="530" text-anchor="middle" fill="#e2e8f0" font-size="14" font-weight="700">retrieve()</text>
<text x="1295" y="552" text-anchor="middle" fill="#94a3b8" font-size="11">single entry point</text>
<text x="1295" y="570" text-anchor="middle" fill="#94a3b8" font-size="11">shared result shape across methods</text>

<text x="775" y="885" text-anchor="middle" fill="#f8fafc" font-size="15" font-weight="700">Figure 1. Retrieval pipeline: ingestion, chunking, embedding, indexing, and three retrieval strategies.</text>
</svg>
