<svg viewBox="0 0 1850 800" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>PubMedQA benchmark architecture</title>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M1,1 L8,5 L1,9 Z" fill="#7d8ba1"/>
</marker>
<symbol id="fileIcon" viewBox="0 0 100 130">
<path d="M0,0 L78,0 L100,22 L100,130 L0,130 Z" stroke-width="3" stroke-linejoin="round"/>
<path d="M78,0 L78,22 L100,22 Z" fill="#ffffff" fill-opacity="0.12" stroke-width="2" stroke-linejoin="round"/>
</symbol>
<symbol id="cylinderIcon" viewBox="0 0 100 90">
<path d="M0,15 A50,15 0 0 0 100,15 L100,75 A50,15 0 0 1 0,75 Z" stroke-width="3"/>
<ellipse cx="50" cy="15" rx="50" ry="15" stroke-width="3"/>
<ellipse cx="50" cy="15" rx="50" ry="15" fill="#ffffff" fill-opacity="0.06" stroke="none"/>
</symbol>
<symbol id="cacheIcon" viewBox="0 0 46 46">
<rect x="10" y="10" width="28" height="28" rx="5" fill="#0b1220" stroke-width="2"/>
<rect x="6" y="6" width="28" height="28" rx="5" stroke-width="2"/>
</symbol>
</defs>

<rect x="0" y="0" width="1850" height="800" fill="#0b1220"/>

<g font-size="12" fill="#94a3b8">
<rect x="1550" y="15" width="24" height="18" rx="4" fill="#16223a" stroke="#60a5fa" stroke-width="2"/>
<text x="1582" y="31">code module</text>
<use href="#cacheIcon" x="1680" y="12" width="24" height="24" fill="#334155" stroke="#cbd5e1"/>
<text x="1712" y="31">memory cache</text>
</g>

<g stroke="#94a3b8" fill="#1c2740">
<use href="#fileIcon" x="72" y="137" width="110" height="143" opacity="0.5"/>
<use href="#fileIcon" x="60" y="149" width="110" height="143"/>
</g>
<text x="115" y="120" text-anchor="middle" fill="#cbd5e1" font-size="13">PubMedQA, 1,000 rows (HuggingFace)</text>

<rect x="260" y="170" width="210" height="100" rx="10" fill="#16223a" stroke="#60a5fa" stroke-width="2.5"/>
<text x="365" y="208" text-anchor="middle" fill="#e2e8f0" font-size="15" font-weight="700">Dataset loader</text>
<text x="365" y="230" text-anchor="middle" fill="#94a3b8" font-size="11.5">pubmedqa_dataset.py</text>
<text x="365" y="248" text-anchor="middle" fill="#94a3b8" font-size="11.5">splits into three files below</text>
<use href="#cacheIcon" x="452" y="156" width="28" height="28" fill="#334155" stroke="#cbd5e1"/>

<use href="#fileIcon" x="560" y="53" width="80" height="104" fill="#1c2740" stroke="#94a3b8"/>
<text x="600" y="41" text-anchor="middle" fill="#cbd5e1" font-size="12">corpus.json</text>

<use href="#fileIcon" x="560" y="168" width="80" height="104" fill="#1c2740" stroke="#94a3b8"/>
<text x="600" y="156" text-anchor="middle" fill="#cbd5e1" font-size="12">queries.json</text>

<use href="#fileIcon" x="560" y="283" width="80" height="104" fill="#1c2740" stroke="#94a3b8"/>
<text x="600" y="271" text-anchor="middle" fill="#cbd5e1" font-size="12">qrels.json</text>

<line x1="170" y1="220" x2="258" y2="220" stroke="#7d8ba1" stroke-width="2" marker-end="url(#ah)"/>
<line x1="470" y1="220" x2="558" y2="105" stroke="#7d8ba1" stroke-width="2" marker-end="url(#ah)"/>
<line x1="470" y1="220" x2="558" y2="220" stroke="#7d8ba1" stroke-width="2" marker-end="url(#ah)"/>
<line x1="470" y1="220" x2="558" y2="335" stroke="#7d8ba1" stroke-width="2" marker-end="url(#ah)"/>

<path d="M600,157 L600,250 L165,250 L165,438" fill="none" stroke="#7d8ba1" stroke-width="2" marker-end="url(#ah)"/>

<path d="M640,220 C780,220 780,300 900,430" fill="none" stroke="#7d8ba1" stroke-width="2" stroke-dasharray="6,5" marker-end="url(#ah)"/>
<path d="M640,335 C780,335 780,430 898,460" fill="none" stroke="#7d8ba1" stroke-width="2" stroke-dasharray="6,5" marker-end="url(#ah)"/>
<text x="760" y="300" text-anchor="middle" fill="#64748b" font-size="10.5">used directly by evaluation</text>

<rect x="60" y="440" width="210" height="100" rx="10" fill="#16223a" stroke="#60a5fa" stroke-width="2.5"/>
<text x="165" y="478" text-anchor="middle" fill="#e2e8f0" font-size="15" font-weight="700">Indexing</text>
<text x="165" y="500" text-anchor="middle" fill="#94a3b8" font-size="11.5">build_pubmedqa_index</text>
<text x="165" y="518" text-anchor="middle" fill="#94a3b8" font-size="11.5">chunk size 120, overlap 20</text>

<line x1="270" y1="490" x2="338" y2="490" stroke="#7d8ba1" stroke-width="2" marker-end="url(#ah)"/>

<use href="#cylinderIcon" x="340" y="414" width="170" height="153" fill="#123529" stroke="#34d399"/>
<text x="425" y="398" text-anchor="middle" fill="#cbd5e1" font-size="13">Isolated ChromaDB collection</text>

<path d="M270,525 C420,590 480,450 588,365" fill="none" stroke="#7d8ba1" stroke-width="2" stroke-dasharray="6,5" marker-end="url(#ah)"/>
<text x="430" y="565" text-anchor="middle" fill="#64748b" font-size="10.5">reads the isolated chunk file directly</text>

<line x1="512" y1="470" x2="588" y2="370" stroke="#7d8ba1" stroke-width="2" marker-end="url(#ah)"/>
<line x1="512" y1="490" x2="588" y2="490" stroke="#7d8ba1" stroke-width="2" marker-end="url(#ah)"/>
<line x1="512" y1="510" x2="588" y2="610" stroke="#7d8ba1" stroke-width="2" marker-end="url(#ah)"/>

<rect x="590" y="325" width="230" height="90" rx="10" fill="#241b3a" stroke="#c084fc" stroke-width="2.5"/>
<text x="705" y="360" text-anchor="middle" fill="#e2e8f0" font-size="14" font-weight="700">BM25 (reused)</text>
<text x="705" y="380" text-anchor="middle" fill="#94a3b8" font-size="11">from the retrieval pipeline</text>
<use href="#cacheIcon" x="792" y="312" width="26" height="26" fill="#334155" stroke="#cbd5e1"/>

<rect x="590" y="445" width="230" height="90" rx="10" fill="#241b3a" stroke="#c084fc" stroke-width="2.5"/>
<text x="705" y="480" text-anchor="middle" fill="#e2e8f0" font-size="14" font-weight="700">Vector (reused)</text>
<text x="705" y="500" text-anchor="middle" fill="#94a3b8" font-size="11">from the retrieval pipeline</text>

<rect x="590" y="565" width="230" height="90" rx="10" fill="#241b3a" stroke="#c084fc" stroke-width="2.5"/>
<text x="705" y="600" text-anchor="middle" fill="#e2e8f0" font-size="14" font-weight="700">Hybrid RRF (reused)</text>
<text x="705" y="620" text-anchor="middle" fill="#94a3b8" font-size="11">from the retrieval pipeline</text>

<line x1="822" y1="370" x2="898" y2="450" stroke="#7d8ba1" stroke-width="2" marker-end="url(#ah)"/>
<line x1="820" y1="490" x2="898" y2="490" stroke="#7d8ba1" stroke-width="2" marker-end="url(#ah)"/>
<line x1="822" y1="610" x2="898" y2="530" stroke="#7d8ba1" stroke-width="2" marker-end="url(#ah)"/>

<rect x="900" y="420" width="230" height="140" rx="10" fill="#16223a" stroke="#60a5fa" stroke-width="2.5"/>
<text x="1015" y="458" text-anchor="middle" fill="#e2e8f0" font-size="14" font-weight="700">Evaluation</text>
<text x="1015" y="480" text-anchor="middle" fill="#94a3b8" font-size="11">recall_at_k and reciprocal_rank</text>
<text x="1015" y="498" text-anchor="middle" fill="#94a3b8" font-size="11">computed per method by run_arena</text>

<line x1="1130" y1="470" x2="1198" y2="470" stroke="#7d8ba1" stroke-width="2" marker-end="url(#ah)"/>

<use href="#fileIcon" x="1200" y="419" width="110" height="143" fill="#1c2740" stroke="#94a3b8"/>
<text x="1255" y="405" text-anchor="middle" fill="#cbd5e1" font-size="12">results.json and per-query CSVs</text>

<line x1="1310" y1="510" x2="1378" y2="510" stroke="#7d8ba1" stroke-width="2" marker-end="url(#ah)"/>

<rect x="1380" y="440" width="210" height="100" rx="10" fill="#16223a" stroke="#60a5fa" stroke-width="2.5"/>
<text x="1485" y="478" text-anchor="middle" fill="#e2e8f0" font-size="15" font-weight="700">view_results.py</text>
<text x="1485" y="500" text-anchor="middle" fill="#94a3b8" font-size="11.5">renders the error pattern chart</text>

<line x1="1590" y1="490" x2="1658" y2="490" stroke="#7d8ba1" stroke-width="2" marker-end="url(#ah)"/>

<use href="#fileIcon" x="1660" y="419" width="110" height="143" fill="#1c2740" stroke="#94a3b8"/>
<text x="1715" y="405" text-anchor="middle" fill="#cbd5e1" font-size="12">error_analysis.png</text>

<text x="925" y="755" text-anchor="middle" fill="#f8fafc" font-size="15" font-weight="700">Figure 2. PubMedQA benchmark: dataset preparation, parallel evaluation across three retrieval methods, and error analysis.</text>
</svg>
